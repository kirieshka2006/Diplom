    .theme-toggle {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 5000;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        background: rgba(20, 26, 47, 0.82);
        color: var(--text-primary);
        padding: 12px 16px 12px 14px;
        min-width: 176px;
        cursor: pointer;
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(18px);
        transition:
            transform 0.2s ease,
            box-shadow 0.25s ease,
            border-color 0.25s ease,
            background 0.25s ease;
    }

    html[data-theme='light'] .theme-toggle {
        background: rgba(255, 255, 255, 0.88);
    }

    .theme-toggle:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow-lg);
    }

    .theme-toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--theme-toggle-ring), var(--shadow-lg);
    }

    .theme-toggle__thumb {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gradient-primary);
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(32, 54, 120, 0.28);
        font-size: 18px;
    }

    .theme-toggle__content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
    }

    .theme-toggle__caption {
        font-size: 11px;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .theme-toggle__label {
        font-size: 14px;
        line-height: 1.3;
        font-weight: 700;
        color: var(--text-primary);
    }

    html[data-theme='light'] ::selection {
        background: rgba(78, 134, 88, 0.22);
        color: var(--text-primary);
    }

    html[data-theme='dark'] ::selection {
        background: rgba(95, 141, 255, 0.26);
        color: var(--text-primary);
    }

    .home-page .mobile-sidebar-toggle {
        display: none;
        width: 46px;
        height: 46px;
        border: 1px solid var(--border-color);
        border-radius: 14px;
        background: var(--surface-elevated, var(--bg-tertiary));
        color: var(--text-primary);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        box-shadow: var(--shadow-sm);
        padding: 0;
        z-index: 120;
    }

    .home-page .mobile-sidebar-toggle span {
        display: block;
        width: 18px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
        transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .home-page.mobile-sidebar-open .mobile-sidebar-toggle span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
    }

    .home-page.mobile-sidebar-open .mobile-sidebar-toggle span:nth-child(2) {
        opacity: 0;
    }

    .home-page.mobile-sidebar-open .mobile-sidebar-toggle span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
    }

    .home-page .mobile-sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 16, 0.52);
        backdrop-filter: blur(4px);
        z-index: 220;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }

    .home-page.mobile-sidebar-open .mobile-sidebar-backdrop {
        opacity: 1;
        pointer-events: auto;
    }
