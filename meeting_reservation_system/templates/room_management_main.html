<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление комнатами</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-card: #1c1c1f;
            --bg-tertiary: #18181b;
            --bg-input: #232326;
            --border-color: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-primary: #3b82f6;
            --accent-success: #22c55e;
            --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-success: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-card);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--bg-tertiary);
            transform: translateX(-4px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 32px;
        }

        .category-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: var(--radius-lg);
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
        }

        .category-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .category-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .category-count {
            color: var(--accent-primary);
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0;
        }

        .category-card small {
            color: var(--text-muted);
            font-size: 13px;
        }

        .btn-create {
            background: var(--gradient-success);
            color: white;
            padding: 28px;
            border-radius: var(--radius-lg);
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-create:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            padding: 32px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 {
            font-size: 20px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            gap: 16px;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-grid input:focus,
        .form-grid select:focus,
        .form-grid textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-grid select option {
            background: var(--bg-tertiary);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }

        .btn-cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-save {
            background: var(--gradient-success);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a href="{% url 'home' %}" class="back-btn">← Назад на главную</a>
            <h1 class="page-title">🚪 Управление комнатами</h1>
            <div style="width: 140px;"></div>
        </div>

        <div class="categories-grid">
            <a href="{% url 'room_management_category' 'economy' %}" class="category-card">
                <div class="category-icon">🟢</div>
                <h3>Эконом</h3>
                <div class="category-count">{{ categories.economy }}</div>
                <small>комнат</small>
            </a>

            <a href="{% url 'room_management_category' 'standard' %}" class="category-card">
                <div class="category-icon">🔵</div>
                <h3>Стандарт</h3>
                <div class="category-count">{{ categories.standard }}</div>
                <small>комнат</small>
            </a>

            <a href="{% url 'room_management_category' 'comfort' %}" class="category-card">
                <div class="category-icon">🟡</div>
                <h3>Комфорт</h3>
                <div class="category-count">{{ categories.comfort }}</div>
                <small>комнат</small>
            </a>

            <a href="{% url 'room_management_category' 'vip' %}" class="category-card">
                <div class="category-icon">🟣</div>
                <h3>VIP</h3>
                <div class="category-count">{{ categories.vip }}</div>
                <small>комнат</small>
            </a>

            <a href="{% url 'room_management_category' 'luxury' %}" class="category-card">
                <div class="category-icon">🔴</div>
                <h3>Люкс</h3>
                <div class="category-count">{{ categories.luxury }}</div>
                <small>комнат</small>
            </a>

        </div>
    </div>

    <!-- Modal -->
    <div id="roomModal" class="modal">
        <div class="modal-content">
            <h3>➕ Создать комнату</h3>
            <form id="roomForm" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-grid">
                    <input type="text" name="name" placeholder="Название комнаты" required>
                    <input type="text" name="location" placeholder="Месторасположение" required>
                    <select name="category" required>
                        <option value="">Выберите категорию</option>
                        <option value="economy">🟢 Эконом</option>
                        <option value="standard">🔵 Стандарт</option>
                        <option value="comfort">🟡 Комфорт</option>
                        <option value="vip">🟣 VIP</option>
                        <option value="luxury">🔴 Люкс</option>
                    </select>
                    <input type="number" name="capacity" placeholder="Вместимость" min="1" required>
                    <input type="number" name="price_per_hour" placeholder="Цена за час" step="100" required>
                    <textarea name="equipment" placeholder="Оборудование" rows="3"></textarea>
                    <input type="file" name="image" accept="image/*">
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-cancel">Отмена</button>
                    <button type="submit" class="btn btn-save">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showAddRoomForm() {
            document.getElementById('roomModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('roomModal').style.display = 'none';
        }

        document.getElementById('roomForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            fetch('/api/add-room/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert('Ошибка: ' + data.error);
                }
            });
        });

        window.onclick = function(event) {
            const modal = document.getElementById('roomModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
