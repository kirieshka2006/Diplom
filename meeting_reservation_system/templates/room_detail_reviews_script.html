<!-- Этот код нужно добавить перед закрывающим тегом </body> в room_detail.html -->
<script>
    // Переменные для работы с отзывами
    const roomId = {{ room.id }};
    let selectedRating = 0;
    let editSelectedRating = 0;

    // Загрузка отзывов при открытии вкладки
    document.addEventListener('DOMContentLoaded', function() {
        // Загружаем отзывы когда открывается вкладка
        const reviewsTab = document.querySelector('[data-tab="reviews"]');
        if (reviewsTab) {
            reviewsTab.addEventListener('click', loadReviews);
        }

        // Инициализация звезд для нового отзыва
        document.querySelectorAll('.star-btn').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.rating);
                document.getElementById('selected-rating').value = selectedRating;
                updateStarsDisplay('.star-btn', selectedRating);
            });

            star.addEventListener('mouseenter', function() {
                updateStarsDisplay('.star-btn', parseInt(this.dataset.rating));
            });

            star.addEventListener('mouseleave', function() {
                updateStarsDisplay('.star-btn', selectedRating);
            });
        });

        // Инициализация звезд для редактирования
        document.querySelectorAll('.edit-star-btn').forEach(star => {
            star.addEventListener('click', function() {
                editSelectedRating = parseInt(this.dataset.rating);
                document.getElementById('edit-selected-rating').value = editSelectedRating;
                updateStarsDisplay('.edit-star-btn', editSelectedRating);
            });

            star.addEventListener('mouseenter', function() {
                updateStarsDisplay('.edit-star-btn', parseInt(this.dataset.rating));
            });

            star.addEventListener('mouseleave', function() {
                updateStarsDisplay('.edit-star-btn', editSelectedRating);
            });
        });
    });

    function updateStarsDisplay(selector, rating) {
        document.querySelectorAll(selector).forEach(star => {
            const starRating = parseInt(star.dataset.rating);
            star.textContent = starRating <= rating ? '★' : '☆';
            star.style.color = starRating <= rating ? '#f59e0b' : '#71717a';
        });
    }

    function loadReviews() {
        fetch(`/api/room/${roomId}/reviews/`)
            .then(response => response.json())
            .then(data => {
                // Обновляем статистику
                document.getElementById('avg-rating').textContent = data.avg_rating;
                document.getElementById('reviews-count').textContent = data.total_count;

                // Звезды для среднего рейтинга
                const starsHtml = generateStarsHtml(data.avg_rating);
                document.getElementById('rating-stars').innerHTML = starsHtml;

                // Проверяем, есть ли у пользователя отзыв
                if (data.user_review) {
                    showUserReviewStatus(data.user_review);
                }

                // Отображаем отзывы
                const reviewsList = document.getElementById('reviews-list');
                if (data.reviews.length === 0) {
                    reviewsList.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 24px;">Пока нет отзывов. Будьте первым!</p>';
                } else {
                    reviewsList.innerHTML = data.reviews.map(review => createReviewCard(review)).join('');
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки отзывов:', error);
            });
    }

    function generateStarsHtml(rating) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            html += `<span style="color: ${i <= rating ? '#f59e0b' : '#71717a'};">${i <= rating ? '★' : '☆'}</span>`;
        }
        return html;
    }

    function showUserReviewStatus(review) {
        const statusContainer = document.getElementById('user-review-status');
        const addForm = document.getElementById('add-review-form');

        statusContainer.style.display = 'block';

        let statusText = '';
        let statusColor = '';

        switch(review.status) {
            case 'pending':
                statusText = `⏳ Ваш отзыв на модерации. Оценка: ${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}`;
                statusColor = 'var(--accent-warning)';
                break;
            case 'approved':
                statusText = `✅ Ваш отзыв опубликован. Оценка: ${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}`;
                statusColor = 'var(--accent-success)';
                break;
            case 'rejected':
                statusText = `❌ Ваш отзыв отклонен.`;
                statusColor = 'var(--accent-danger)';
                break;
        }

        statusContainer.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p style="color: ${statusColor}; font-weight: 500;">${statusText}</p>
                <button onclick="startEditReview(${review.id}, ${review.rating}, '${review.text.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')"
                        style="padding: 8px 16px; background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-size: 13px;">
                    ✏️ Редактировать
                </button>
            </div>
        `;

        addForm.style.display = 'none';
    }

    function createReviewCard(review) {
        const starsHtml = generateStarsHtml(review.rating);
        const avatarHtml = review.avatar
            ? `<img src="${review.avatar}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;">`
            : `<div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>`;

        return `
            <div style="background: var(--bg-tertiary); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                <div style="display: flex; gap: 16px;">
                    ${avatarHtml}
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: 600; color: var(--text-primary);">${review.username}</span>
                            <span style="font-size: 12px; color: var(--text-muted);">${review.created_at}</span>
                        </div>
                        <div style="margin-bottom: 12px; font-size: 18px;">${starsHtml}</div>
                        <p style="color: var(--text-secondary); line-height: 1.6;">${review.text}</p>
                    </div>
                </div>
            </div>
        `;
    }

    function submitReview() {
        const rating = document.getElementById('selected-rating').value;
        const text = document.getElementById('review-text').value.trim();

        if (rating == 0) {
            alert('Пожалуйста, выберите оценку!');
            return;
        }

        if (text.length < 10) {
            alert('Отзыв должен содержать минимум 10 символов!');
            return;
        }

        fetch(`/api/room/${roomId}/add-review/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ rating: parseInt(rating), text: text })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                document.getElementById('review-text').value = '';
                selectedRating = 0;
                updateStarsDisplay('.star-btn', 0);
                loadReviews();
            } else {
                alert('Ошибка: ' + data.error);
            }
        });
    }

    function startEditReview(reviewId, rating, text) {
        document.getElementById('edit-review-form').style.display = 'block';
        document.getElementById('add-review-form').style.display = 'none';

        document.getElementById('edit-review-id').value = reviewId;
        document.getElementById('edit-review-text').value = text.replace(/\\n/g, '\n');
        editSelectedRating = rating;
        document.getElementById('edit-selected-rating').value = rating;
        updateStarsDisplay('.edit-star-btn', rating);
    }

    function cancelEditReview() {
        document.getElementById('edit-review-form').style.display = 'none';
        loadReviews();
    }

    function updateReview() {
        const reviewId = document.getElementById('edit-review-id').value;
        const rating = document.getElementById('edit-selected-rating').value;
        const text = document.getElementById('edit-review-text').value.trim();

        if (rating == 0) {
            alert('Пожалуйста, выберите оценку!');
            return;
        }

        if (text.length < 10) {
            alert('Отзыв должен содержать минимум 10 символов!');
            return;
        }

        fetch(`/api/review/${reviewId}/edit/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ rating: parseInt(rating), text: text })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                document.getElementById('edit-review-form').style.display = 'none';
                loadReviews();
            } else {
                alert('Ошибка: ' + data.error);
            }
        });
    }

    function getCsrfToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
               document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
    }
</script>
