<!-- Phone and Email Validation Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // ===== PHONE VALIDATION =====
    const phoneInput = document.getElementById('phoneInput');
    const phoneError = document.getElementById('phoneError');
    const savePersonalBtn = document.getElementById('savePersonalBtn');

    if (phoneInput) {
        // Format phone as user types: +7 (XXX) XXX-XX-XX
        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove all non-digits

            // If starts with 8, replace with 7
            if (value.startsWith('8')) {
                value = '7' + value.substring(1);
            }

            // If doesn't start with 7, add it
            if (value.length > 0 && !value.startsWith('7')) {
                value = '7' + value;
            }

            // Limit to 11 digits (7 + 10 digits)
            value = value.substring(0, 11);

            // Format the phone number
            let formatted = '';
            if (value.length > 0) {
                formatted = '+' + value[0]; // +7
            }
            if (value.length > 1) {
                formatted += ' (' + value.substring(1, 4); // (XXX
            }
            if (value.length >= 4) {
                formatted += ')'; // )
            }
            if (value.length > 4) {
                formatted += ' ' + value.substring(4, 7); // XXX
            }
            if (value.length > 7) {
                formatted += '-' + value.substring(7, 9); // XX
            }
            if (value.length > 9) {
                formatted += '-' + value.substring(9, 11); // XX
            }

            e.target.value = formatted;

            // Validate
            validatePhone();
        });

        // Handle paste
        phoneInput.addEventListener('paste', function(e) {
            e.preventDefault();
            let paste = (e.clipboardData || window.clipboardData).getData('text');
            let digits = paste.replace(/\D/g, '');

            if (digits.startsWith('8')) {
                digits = '7' + digits.substring(1);
            }
            if (!digits.startsWith('7') && digits.length > 0) {
                digits = '7' + digits;
            }

            // Trigger input event with the pasted value
            phoneInput.value = digits;
            phoneInput.dispatchEvent(new Event('input'));
        });

        // Handle keydown for better UX
        phoneInput.addEventListener('keydown', function(e) {
            // Allow: backspace, delete, tab, escape, enter
            if ([8, 9, 27, 13, 46].indexOf(e.keyCode) !== -1 ||
                // Allow: Ctrl+A, Ctrl+C, Ctrl+V, Ctrl+X
                (e.keyCode === 65 && e.ctrlKey === true) ||
                (e.keyCode === 67 && e.ctrlKey === true) ||
                (e.keyCode === 86 && e.ctrlKey === true) ||
                (e.keyCode === 88 && e.ctrlKey === true) ||
                // Allow: home, end, left, right
                (e.keyCode >= 35 && e.keyCode <= 39)) {
                return;
            }
            // Block non-numbers
            if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) {
                // Allow + at the beginning
                if (e.keyCode === 187 && e.shiftKey && this.value.length === 0) {
                    return;
                }
                e.preventDefault();
            }
        });

        function validatePhone() {
            const value = phoneInput.value;
            const digits = value.replace(/\D/g, '');

            // Empty is valid (phone is optional)
            if (value === '' || value === '+7') {
                phoneError.style.display = 'none';
                phoneInput.style.borderColor = '';
                if (savePersonalBtn) savePersonalBtn.disabled = false;
                return true;
            }

            // Must be exactly 11 digits (7 + 10)
            if (digits.length === 11 && digits.startsWith('7')) {
                phoneError.style.display = 'none';
                phoneInput.style.borderColor = '#22c55e';
                if (savePersonalBtn) savePersonalBtn.disabled = false;
                return true;
            } else {
                phoneError.style.display = 'block';
                phoneInput.style.borderColor = '#ef4444';
                if (savePersonalBtn) savePersonalBtn.disabled = true;
                return false;
            }
        }

        // Initial validation if there's a value
        if (phoneInput.value) {
            // Format existing value
            let existing = phoneInput.value.replace(/\D/g, '');
            if (existing.length > 0) {
                phoneInput.value = existing;
                phoneInput.dispatchEvent(new Event('input'));
            }
        }
    }

    // ===== EMAIL VALIDATION =====
    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    const sendCodeBtn = document.getElementById('sendCodeBtn');

    if (emailInput) {
        emailInput.addEventListener('input', function() {
            validateEmail();
        });

        emailInput.addEventListener('blur', function() {
            validateEmail();
        });

        function validateEmail() {
            const value = emailInput.value.trim();

            // Empty is invalid for sending code
            if (value === '') {
                emailError.style.display = 'none';
                emailInput.style.borderColor = '';
                if (sendCodeBtn) sendCodeBtn.disabled = true;
                return false;
            }

            // Email regex pattern
            const emailPattern = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;

            if (emailPattern.test(value)) {
                emailError.style.display = 'none';
                emailInput.style.borderColor = '#22c55e';
                if (sendCodeBtn) sendCodeBtn.disabled = false;
                return true;
            } else {
                emailError.style.display = 'block';
                emailInput.style.borderColor = '#ef4444';
                if (sendCodeBtn) sendCodeBtn.disabled = true;
                return false;
            }
        }

        // Initial validation
        validateEmail();
    }
});
</script>
